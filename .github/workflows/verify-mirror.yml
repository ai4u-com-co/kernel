name: Verificar espejos

# Semanal (y a mano): comprueba que el último tag de cada paquete en kernel llegó a su repo espejo.
# Si falta alguno, abre (o actualiza) UN Issue. Detecta casos como platform-v0.7.0 (30-oct-2026),
# taggeado sobre un commit con `[skip ci]`, que nunca disparó mirror.yml. Costo: ~1 min/semana.

on:
  schedule:
    - cron: '0 13 * * 1'   # lunes 08:00 Bogotá
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comparar último tag de kernel con el espejo
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          bash scripts/verify-mirror.sh | tee report.txt
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Abrir Issue si hay espejos desfasados
        if: steps.verify.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Espejo desfasado: hay tags de kernel sin publicar"
          body="$(printf 'Detectado por `verify-mirror.yml`.\n\n```\n%s\n```\n\nRe-publicar sin re-taggear: `gh workflow run mirror.yml -f tag=<paquete>-vX.Y.Z`.\nCausa frecuente: el commit taggeado lleva `[skip ci]`.' "$(cat report.txt)")"
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1
