name: Espejo de paquete

# Al taggear "<paquete>-vX.Y.Z" (ej. config-v0.2.0), compila ESE paquete y publica su
# contenido (src/ + dist/) como commit + tag en su repo espejo (ej. ai4u-com-co/config),
# preservando el contrato externo: los consumidores existentes siguen instalando
# "github:ai4u-com-co/<paquete>#vX.Y.Z" sin enterarse de que el código fuente real vive
# en este monorepo.
#
# Credencial: reusa la GitHub App de bump-bot (mismo mecanismo ya validado en
# ai4u-com-co/bump-bot#bump.yml — secrets BUMP_BOT_APP_CLIENT_ID/BUMP_BOT_APP_PRIVATE_KEY,
# App instalada en la org con "All repositories"). Mintea un token de instalación acotado
# SOLO al repo espejo del paquete que se está publicando (`repositories:` explícito) — no
# un PAT largo con acceso a toda la org.
#
# PASO HUMANO: esos 2 secrets viven hoy solo en el repo `bump-bot` — GitHub nunca expone
# el valor de un secreto ya configurado (ni con autorización, no hay forma de leerlo por
# API), así que hace falta que alguien con acceso a la clave privada original la agregue
# también acá. Sin esos secrets, el step de abajo falla explícito, no en silencio.

on:
  push:
    tags:
      - '*-v*.*.*'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolver paquete y versión del tag
        id: parse
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$REF_NAME" =~ ^([a-z0-9-]+)-(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::tag '$REF_NAME' no matchea el formato <paquete>-vX.Y.Z"
            exit 1
          fi
          PACKAGE="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[2]}"
          if [ ! -d "packages/$PACKAGE" ]; then
            echo "::error::no existe packages/$PACKAGE en este repo"
            exit 1
          fi
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Leer sourceRepo del paquete (mirror.json)
        id: mirror
        env:
          PACKAGE: ${{ steps.parse.outputs.package }}
        run: |
          set -euo pipefail
          MIRROR_REPO="$(jq -r --arg p "$PACKAGE" '.[$p]' mirror.json)"
          if [ -z "$MIRROR_REPO" ] || [ "$MIRROR_REPO" = "null" ]; then
            echo "::error::$PACKAGE no tiene repo espejo declarado en mirror.json"
            exit 1
          fi
          echo "repo=$MIRROR_REPO" >> "$GITHUB_OUTPUT"
          echo "repo_name=${MIRROR_REPO#*/}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build del paquete
        working-directory: packages/${{ steps.parse.outputs.package }}
        run: |
          npm ci
          npm run build

      - name: Verificar credencial
        run: |
          if [ -z "${{ secrets.BUMP_BOT_APP_CLIENT_ID }}" ] || [ -z "${{ secrets.BUMP_BOT_APP_PRIVATE_KEY }}" ]; then
            echo "::error::Faltan los secrets BUMP_BOT_APP_CLIENT_ID / BUMP_BOT_APP_PRIVATE_KEY en este repo (kernel) — mismos valores que ya existen en ai4u-com-co/bump-bot. Ver README, sección 'Credencial [PASO HUMANO]'."
            exit 1
          fi

      - name: Mintear token de instalación (GitHub App), acotado al repo espejo
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BUMP_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_BOT_APP_PRIVATE_KEY }}
          owner: ai4u-com-co
          repositories: ${{ steps.mirror.outputs.repo_name }}

      - name: Push del contenido al repo espejo
        env:
          MIRROR_TOKEN: ${{ steps.app-token.outputs.token }}
          MIRROR_REPO: ${{ steps.mirror.outputs.repo }}
          PACKAGE: ${{ steps.parse.outputs.package }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "kernel-mirror-bot"
          git config user.email "kernel-mirror-bot@users.noreply.github.com"
          WORK_DIR="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git" "$WORK_DIR"
          rsync -a --delete --exclude=.git "packages/${PACKAGE}/" "$WORK_DIR/"
          cd "$WORK_DIR"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios de contenido, solo tag."
          else
            git commit -m "chore: sync desde ai4u-com-co/kernel packages/${PACKAGE} (${VERSION})"
            git push
          fi
          git tag "${VERSION}"
          git push origin "${VERSION}"
